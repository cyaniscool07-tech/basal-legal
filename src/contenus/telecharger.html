
<div class="page" role="main">

  <h1 id="contenu">Télécharger Basal</h1>
  <p class="chapeau">Gratuit, sans compte, sans publicité. Premium en option.</p>

  <div class="stores">
    <a id="lien-play" data-goatcounter-click="store-play-telecharger" href="https://play.google.com/store/apps/details?id=com.reqquiem07.calorietracker&amp;referrer=utm_source%3Dbasal-app.fr%26utm_medium%3Dsite%26utm_campaign%3Dtelecharger"><img src="/img/google-play-fr.png" alt="Disponible sur Google Play" width="148" height="44"></a>
    <a id="lien-apple" data-goatcounter-click="store-apple-telecharger" href="https://apps.apple.com/fr/app/basal/id6793001641"><img src="/img/app-store-fr.svg" alt="Télécharger dans l’App Store" width="139" height="44"></a>
  </div>
  <p class="discret" style="margin-top:14px"><a href="/">Découvrir l’application</a></p>

</div>

<script>
// Lien de bio (TikTok, Instagram) : le téléphone part vers son store. Le délai laisse GoatCounter
// compter la visite ; les deux boutons restent pour un ordinateur ou si la redirection échoue.
(function () {
  var ua = navigator.userAgent, ipad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var source = (new URLSearchParams(location.search).get('utm_source') || 'basal-app.fr').replace(/[^\w.-]/g, '');
  var play = document.getElementById('lien-play');
  play.href = play.href.replace('utm_source%3Dbasal-app.fr', 'utm_source%3D' + source);
  var cible = /Android/i.test(ua) ? play.href : (/iPhone|iPad|iPod/.test(ua) || ipad) ? document.getElementById('lien-apple').href : null;
  if (cible) setTimeout(function () { location.replace(cible); }, 700);
})();
</script>
